apiVersion: v1
kind: ServiceAccount
metadata:
  name: synth-control-plane
  namespace: synth-control-plane
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: synth-sandbox-controller
  namespace: synth-sandboxes
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: synth-sandbox-controller
  namespace: synth-sandboxes
subjects:
  - kind: ServiceAccount
    name: synth-control-plane
    namespace: synth-control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: synth-sandbox-controller
