# The Temporal worker IS the runtime.
#
# ONE entry point (`integrations/temporal/src/worker-entry.ts`, compiled to
# `.../worker-entry.js`) registers BOTH the runtime workflows/activities
# (`durableAgentWorkflow` + `runTurn`) and the gym workflows/activities
# (`gymAttemptWorkflow` + `gymPrepareActivity`/`gymRunTurn`/`gymScoreActivity`)
# on one task queue. There is no separate gym worker to deploy.
#
# Scaling: the worker is stateless — all durable state is in Temporal, all
# shared store state is in Postgres — so scale by changing `spec.replicas`.
# Every replica polls the same `TEMPORAL_TASK_QUEUE`; Temporal dispatches each
# task to exactly one replica. No homegrown control plane.
#
# Killing a replica (rollout, OOM, eviction) does not lose work: the in-flight
# activity's heartbeat fails on another replica, Temporal retries it there, and
# committed workflow history is replayed, not re-executed. Proven live by
# `integrations/temporal/durable-restart-worker.ts` (SIGKILL mid-turn, call
# counts before/after) and `graph-restart-worker.ts` (SIGKILL mid-graph).
#
# It is a trusted control-plane process: it holds the gateway credentials and
# (for the execution rung) the Kubernetes credentials, and it dispatches
# model-authored code into gVisor executor Pods. The cluster-side proof is
# manual (`deploy/kubernetes/README.md`); this manifest is not applied by CI.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: synth-temporal-worker
  namespace: synth-control-plane
data:
  TEMPORAL_ADDRESS: "temporal-frontend.temporal.svc.cluster.local:7233"
  TEMPORAL_NAMESPACE: "default"
  # All replicas share one queue; scale with `spec.replicas`.
  TEMPORAL_TASK_QUEUE: "synth-agent-runtime"
  GATEWAY_BASE_URL: "http://synth-gateway.synth-control-plane.svc.cluster.local:8787"
  GATEWAY_MODEL: "worker/cheap"
  # Native Temporal worker concurrency. Size for the pods' CPU/memory; a turn is
  # mostly network-wait, so activities can exceed cores. Use either these knobs
  # or the Tuner, not both.
  SYNTH_WORKER_MAX_CONCURRENT_ACTIVITIES: "16"
  SYNTH_WORKER_MAX_CONCURRENT_WORKFLOWS: "32"
  # `GET /healthz` (200 ready / 503 draining) for the probes below.
  SYNTH_WORKER_HEALTH_PORT: "8085"
  # Worker Deployment versioning (safe rolling deploys). Set a build id per
  # image (e.g. the git SHA) and a deployment name; AUTO_UPGRADE moves a run to
  # the new version on its next task, PINNED keeps it on its build. Register the
  # version with `temporal worker deployment` before rolling out. Omit both to
  # run unversioned.
  # SYNTH_WORKER_DEPLOYMENT_NAME: "synth-agent-runtime"
  # SYNTH_WORKER_BUILD_ID: "REPLACE_WITH_GIT_SHA"
  # SYNTH_WORKER_DEFAULT_VERSIONING_BEHAVIOR: "AUTO_UPGRADE"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synth-temporal-worker
  namespace: synth-control-plane
  labels:
    app.kubernetes.io/name: synth-temporal-worker
spec:
  # Stateless replicas behind one shared task queue. Raise this number to scale;
  # nothing else changes.
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: synth-temporal-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synth-temporal-worker
    spec:
      # Give the worker time to drain in-flight activities on SIGTERM before the
      # kubelet SIGKILLs it (the worker's runUntil + shutdownGraceTime drain).
      terminationGracePeriodSeconds: 40
      # The worker is trusted control-plane code; it runs in the restricted
      # namespace and never mounts a host path. Untrusted code runs only in the
      # sandbox namespace behind the gVisor RuntimeClass.
      serviceAccountName: synth-control-plane
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: registry.example/synth-temporal-worker:0.4.0
          command: ["node", "integrations/temporal/dist/integrations/temporal/src/worker-entry.js"]
          envFrom:
            - configMapRef:
                name: synth-temporal-worker
            - secretRef:
                name: synth-temporal-worker-secrets
          ports:
            - name: health
              containerPort: 8085
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# Required secret keys (create out of band; never commit values):
#   GATEWAY_API_KEY        bearer token for the inference gateway
#   SYNTH_POSTGRES_URL     Postgres DSN for the Postgres-backed stores
#   SYNTH_EXECUTOR_IMAGE   executor image pinned by digest
apiVersion: v1
kind: Secret
metadata:
  name: synth-temporal-worker-secrets
  namespace: synth-control-plane
type: Opaque
stringData: {}
