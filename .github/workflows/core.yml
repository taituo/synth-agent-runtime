name: core
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: secret scan (git index)
        run: npm run secret-scan
      - run: npm test
      - run: npm run integrations:syntax

  temporal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: install Temporal integration dependencies
        run: npm install --prefix integrations/temporal
      - run: npm run build --prefix integrations/temporal
      - run: npm test --prefix integrations/temporal
      - name: live proofs (infra-absent proofs skip honestly, never pass)
        run: node scripts/live-proofs.mjs
