name: core
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: secret scan (git index)
        run: npm run secret-scan
      - run: npm test
      - run: npm run integrations:syntax

  temporal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: install Temporal integration dependencies
        run: npm install --prefix integrations/temporal
      - run: npm run build --prefix integrations/temporal
      - run: npm test --prefix integrations/temporal
      - name: install the Temporal CLI
        uses: temporalio/setup-temporal@v0
      # Start a real dev server and run the Temporal-dependent proofs in one
      # step so the background server is alive for them. `live-proofs.mjs`
      # exits 2 when any selected proof skips, so a missing server fails the
      # job instead of silently passing on skips.
      - name: Temporal live proofs against a dev server
        run: |
          temporal server start-dev --headless --port 7243 --db-filename /tmp/temporal-dev.db > /tmp/temporal-dev.log 2>&1 &
          for _ in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/7243) 2>/dev/null; then echo "temporal 127.0.0.1:7243 is up"; break; fi
            sleep 1
          done
          node scripts/live-proofs.mjs --only=graph-restart,durable-restart,graph-child,graph-continue-as-new,graph-cancel,effect-receipt --timeout=600000

  # The gym anti-cheat and boundary regressions, run explicitly so a future
  # change to the test glob cannot silently drop them. Unit-level only: the
  # gVisor pod tests SKIP without a cluster (they are never counted as passes).
  gym:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: gym scorer forgeries, hardening and boundary (unit level)
        run: >-
          node --test
          dist/test/gym-forge.test.js
          dist/test/gym-forge-channels.test.js
          dist/test/gym-scoring.test.js
          dist/test/gym-scoring-hardening.test.js
          dist/test/gym-patch-paths.test.js
          dist/test/gym-runner-isolation.test.js
          dist/test/gym-sandbox-boundary.test.js
          dist/test/gym-sandbox-rung.test.js
          dist/test/gym-durable-path.test.js
          dist/test/sandbox-workspace.test.js
          dist/test/symlink-target.test.js
      - name: gym durable-turn activity boundary (temporal)
        run: |
          npm install --prefix integrations/temporal
          integrations/temporal/node_modules/.bin/tsx --test integrations/temporal/test/gym-activities.test.ts
